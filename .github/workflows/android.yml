name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm   # requires package-lock.json to be committed

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Reproducible install: fails if package-lock.json is missing or out of sync
      - name: Install dependencies
        run: npm ci

      # Stage index.html, assets/ and data.json into www/ (Capacitor's webDir).
      # www/ is generated here and is not committed.
      - name: Stage web assets
        run: npm run build:web

      # Generates the android/ project if you haven't committed one
      - name: Add Android platform
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tactical-map-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk